name: US Stock Daily Report

on:
  # 1. 定时任务：北京时间周二至周六 06:30 (UTC 22:30)
  schedule:
    - cron: '30 22 * * 1-5'
  
  # 2. 手动触发按钮 (带输入框)
  workflow_dispatch:
    inputs:
      test_date:
        description: '【测试用】输入日期 (格式 YYYY-MM-DD)，留空则为今天'
        required: false
        default: ''

jobs:
  run_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Report Script
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          # 将手动输入的日期传入环境变量
          INPUT_TEST_DATE: ${{ github.event.inputs.test_date }}
        run: python market_report.py
