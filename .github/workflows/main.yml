name: US Stock Daily Report

on:
  schedule:
    # 美东时间 16:45：收盘后 45 分钟
    # 北京时间：夏令时次日 04:45，冬令时次日 05:45
    - cron: '45 16 * * 1-5'
      timezone: 'America/New_York'

  # 2. 手动触发按钮 (无输入框版)
  # 点击后直接运行，不再弹窗询问日期
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check_manual_run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check successful manual run today
        id: check
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            if (context.eventName !== 'schedule') {
              core.info('当前为手动触发，正常执行报表。');
              core.setOutput('should_run', 'true');
              return;
            }

            try {
              const dateParts = Object.fromEntries(
                new Intl.DateTimeFormat('en-US', {
                  timeZone: 'Asia/Shanghai',
                  year: 'numeric',
                  month: '2-digit',
                  day: '2-digit'
                }).formatToParts(new Date()).map(({ type, value }) => [type, value])
              );

              const beijingDate = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
              const startTime = new Date(`${beijingDate}T00:00:00+08:00`).toISOString();

              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'main.yml',
                branch: process.env.GITHUB_REF_NAME,
                event: 'workflow_dispatch',
                status: 'success',
                created: `>=${startTime}`,
                per_page: 100
              });

              const manualRun = data.workflow_runs[0];
              if (manualRun) {
                core.info(`北京时间 ${beijingDate} 已有成功的手动运行 #${manualRun.run_number}：${manualRun.html_url}`);
                core.info('跳过本次定时报表，避免重复发送。');
                core.setOutput('should_run', 'false');
              } else {
                core.info(`北京时间 ${beijingDate} 未发现成功的手动运行，继续执行定时报表。`);
                core.setOutput('should_run', 'true');
              }
            } catch (error) {
              core.warning(`检查手动运行记录失败：${error.message}`);
              core.warning('为避免漏发日报，本次定时报表继续执行。');
              core.setOutput('should_run', 'true');
            }

  run_report:
    needs: check_manual_run
    if: needs.check_manual_run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Report Script
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          # 注意：这里删除了 INPUT_TEST_DATE 变量
          # Python 脚本读取不到这个变量时，会自动进入“自动获取当天数据”模式
        run: python market_report.py
